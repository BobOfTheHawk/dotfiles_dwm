<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>bob's nvim reference</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600&family=Fira+Code:wght@300;400;500&display=swap');

:root {
  --bg0-h: #1d2021;
  --bg0: #282828;
  --bg1: #3c3836;
  --bg2: #504945;
  --bg3: #665c54;
  --bg4: #7c6f64;
  --fg0: #fbf1c7;
  --fg1: #ebdbb2;
  --fg2: #d5c4a1;
  --fg3: #bdae93;
  --fg4: #a89984;
  --red: #cc241d;
  --red-bright: #fb4934;
  --green: #98971a;
  --green-bright: #b8bb26;
  --yellow: #d79921;
  --yellow-bright: #fabd2f;
  --blue: #458588;
  --blue-bright: #83a598;
  --purple: #b16286;
  --purple-bright: #d3869b;
  --aqua: #689d6a;
  --aqua-bright: #8ec07c;
  --orange: #d65d0e;
  --orange-bright: #fe8019;
  --gray: #928374;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg0-h);
  color: var(--fg1);
  font-family: 'JetBrains Mono', 'Fira Code', monospace;
  font-size: 13px;
  line-height: 1.6;
  min-height: 100vh;
}

/* HEADER */
.header {
  background: var(--bg0);
  border-bottom: 1px solid var(--bg2);
  padding: 20px 24px 16px;
  position: sticky;
  top: 0;
  z-index: 100;
}

.header-top {
  display: flex;
  align-items: baseline;
  gap: 12px;
  margin-bottom: 14px;
}

.title {
  font-size: 22px;
  font-weight: 600;
  color: var(--yellow-bright);
  letter-spacing: -0.5px;
}

.subtitle {
  font-size: 12px;
  color: var(--fg4);
}

.search {
  width: 100%;
  background: var(--bg1);
  border: 1px solid var(--bg3);
  border-radius: 4px;
  padding: 7px 12px;
  color: var(--fg1);
  font-family: inherit;
  font-size: 13px;
  outline: none;
  transition: border-color 0.15s;
  margin-bottom: 12px;
}

.search:focus { border-color: var(--yellow); }
.search::placeholder { color: var(--bg4); }

.tabs {
  display: flex;
  gap: 4px;
  flex-wrap: wrap;
}

.tab {
  padding: 4px 11px;
  border-radius: 3px;
  font-size: 11px;
  cursor: pointer;
  border: 1px solid var(--bg3);
  color: var(--fg4);
  background: transparent;
  font-family: inherit;
  transition: all 0.12s;
  letter-spacing: 0.02em;
}
.tab:hover { border-color: var(--fg4); color: var(--fg2); }
.tab.active { background: var(--yellow); border-color: var(--yellow); color: var(--bg0-h); font-weight: 600; }
.tab.cat-file.active { background: var(--aqua-bright); border-color: var(--aqua-bright); }
.tab.cat-edit.active { background: var(--green-bright); border-color: var(--green-bright); }
.tab.cat-lsp.active { background: var(--purple-bright); border-color: var(--purple-bright); }
.tab.cat-git.active { background: var(--orange-bright); border-color: var(--orange-bright); }
.tab.cat-ui.active { background: var(--blue-bright); border-color: var(--blue-bright); }
.tab.cat-nav.active { background: var(--yellow-bright); border-color: var(--yellow-bright); }
.tab.cat-win.active { background: var(--red-bright); border-color: var(--red-bright); }

/* MAIN */
.main { padding: 16px 24px 40px; max-width: 900px; margin: 0 auto; }

/* SECTION */
.section { margin-bottom: 8px; border: 1px solid var(--bg2); border-radius: 5px; overflow: hidden; }

.section-header {
  padding: 10px 14px;
  background: var(--bg0);
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 10px;
  user-select: none;
  transition: background 0.1s;
}
.section-header:hover { background: var(--bg1); }

.section-icon { font-size: 14px; width: 18px; text-align: center; flex-shrink: 0; }
.section-name { font-size: 13px; font-weight: 600; color: var(--fg0); flex: 1; }
.section-tagline { font-size: 11px; color: var(--fg4); }
.section-badge {
  font-size: 10px;
  padding: 1px 7px;
  border-radius: 99px;
  font-weight: 600;
  flex-shrink: 0;
  letter-spacing: 0.04em;
}

.badge-file { background: var(--aqua); color: var(--bg0-h); }
.badge-edit { background: var(--green); color: var(--bg0-h); }
.badge-lsp { background: var(--purple); color: var(--fg0); }
.badge-git { background: var(--orange); color: var(--bg0-h); }
.badge-ui { background: var(--blue); color: var(--fg0); }
.badge-nav { background: var(--yellow); color: var(--bg0-h); }
.badge-win { background: var(--red); color: var(--fg0); }

.chevron { color: var(--bg4); font-size: 10px; transition: transform 0.15s; flex-shrink: 0; }
.chevron.open { transform: rotate(90deg); color: var(--fg4); }

.section-body { display: none; padding: 14px; background: var(--bg0-h); border-top: 1px solid var(--bg2); }
.section-body.open { display: block; }

/* BLOCKS */
.block { margin-bottom: 14px; }
.block:last-child { margin-bottom: 0; }

.block-label {
  font-size: 10px;
  color: var(--yellow);
  text-transform: uppercase;
  letter-spacing: 0.1em;
  margin-bottom: 6px;
  font-weight: 500;
}

/* KEYBINDS */
.kb { display: flex; align-items: baseline; gap: 10px; padding: 5px 0; border-bottom: 1px solid var(--bg1); }
.kb:last-child { border-bottom: none; }

kbd {
  font-family: inherit;
  font-size: 11px;
  background: var(--bg2);
  border: 1px solid var(--bg3);
  border-bottom: 2px solid var(--bg4);
  border-radius: 3px;
  padding: 1px 7px;
  color: var(--yellow-bright);
  white-space: nowrap;
  flex-shrink: 0;
}

.kb-desc { font-size: 12px; color: var(--fg3); }
.kb-mode { font-size: 10px; color: var(--bg4); margin-left: auto; flex-shrink: 0; }

/* TIP */
.tip {
  background: var(--bg1);
  border-left: 3px solid var(--aqua);
  border-radius: 0 3px 3px 0;
  padding: 8px 12px;
  font-size: 12px;
  color: var(--fg3);
  line-height: 1.7;
  white-space: pre-wrap;
}

.tip.tip-warn { border-left-color: var(--yellow); }
.tip.tip-green { border-left-color: var(--green-bright); }

/* GRID */
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
@media (max-width: 600px) { .grid2 { grid-template-columns: 1fr; } }

/* WORKFLOW */
.workflow { display: flex; flex-direction: column; gap: 4px; }
.workflow-step { display: flex; align-items: flex-start; gap: 10px; padding: 5px 0; }
.step-num { background: var(--yellow); color: var(--bg0-h); font-size: 10px; font-weight: 700; border-radius: 99px; width: 18px; height: 18px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-top: 1px; }
.step-text { font-size: 12px; color: var(--fg3); line-height: 1.5; }
.step-text kbd { font-size: 10px; }

/* NO RESULTS */
.no-results { text-align: center; padding: 3rem; color: var(--bg4); }
.no-results span { font-size: 14px; display: block; margin-top: 8px; }

/* MODE INDICATOR colors */
.mode-n { color: var(--blue-bright); }
.mode-i { color: var(--green-bright); }
.mode-v { color: var(--purple-bright); }
.mode-c { color: var(--yellow-bright); }

/* divider */
.divider { height: 1px; background: var(--bg2); margin: 10px 0; }

.inline-code { background: var(--bg2); padding: 1px 5px; border-radius: 3px; color: var(--aqua-bright); font-family: inherit; font-size: 11px; }

.count { color: var(--bg4); font-size: 11px; margin-left: 4px; }
</style>
</head>
<body>

<div class="header">
  <div class="header-top">
    <div class="title">bob's nvim</div>
    <div class="subtitle">complete plugin & keybind reference</div>
  </div>
  <input class="search" id="search" placeholder="/ search keybind, plugin, action..." />
  <div class="tabs" id="tabs">
    <button class="tab active" data-cat="all">all</button>
    <button class="tab cat-nav" data-cat="nav">navigation</button>
    <button class="tab cat-file" data-cat="file">files</button>
    <button class="tab cat-edit" data-cat="edit">editing</button>
    <button class="tab cat-lsp" data-cat="lsp">lsp</button>
    <button class="tab cat-git" data-cat="git">git</button>
    <button class="tab cat-ui" data-cat="ui">ui</button>
    <button class="tab cat-win" data-cat="win">windows</button>
  </div>
</div>

<div class="main" id="main"></div>

let activeFilter = 'all';
let searchVal = '';
let openSections = new Set();

function badgeClass(cat) {
  return { file:'badge-file', edit:'badge-edit', lsp:'badge-lsp', git:'badge-git', ui:'badge-ui', nav:'badge-nav', win:'badge-win' }[cat] || 'badge-ui';
}

function catLabel(cat) {
  return { file:'files', edit:'editing', lsp:'lsp', git:'git', ui:'ui', nav:'navigation', win:'windows' }[cat] || cat;
}

function esc(str) {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function renderSections(sections) {
  return sections.map(s => {
    let html = '';
    if (s.label) html += `<div class="block-label">${s.label}</div>`;
    if (s.keys) {
      html += s.keys.map(([k, d, mode]) =>
        `<div class="kb"><kbd>${esc(k)}</kbd><span class="kb-desc">${esc(d)}</span>${mode ? `<span class="kb-mode">${mode}</span>` : ''}</div>`
      ).join('');
    }
    if (s.workflow) {
      html += `<div class="workflow">${s.workflow.map((step, i) =>
        `<div class="workflow-step"><div class="step-num">${i+1}</div><div class="step-text">${step}</div></div>`
      ).join('')}</div>`;
    }
    if (s.tip) {
      html += `<div class="tip ${s.tipClass||''}">${s.tip.replace(/\n/g,'<br>').replace(/<kbd>(.*?)<\/kbd>/g,'<kbd>$1</kbd>')}</div>`;
    }
    return `<div class="block">${html}</div>`;
  }).join('');
}

function render() {
  const container = document.getElementById('main');
  const q = searchVal.toLowerCase();

  const filtered = data.filter(p => {
    const catMatch = activeFilter === 'all' || p.cat === activeFilter;
    if (!catMatch) return false;
    if (!q) return true;
    const inName = p.name.toLowerCase().includes(q);
    const inTag = p.tagline.toLowerCase().includes(q);
    const inSections = p.sections.some(s => {
      const inLabel = s.label && s.label.toLowerCase().includes(q);
      const inKeys = s.keys && s.keys.some(([k,d]) => k.toLowerCase().includes(q) || d.toLowerCase().includes(q));
      const inTip = s.tip && s.tip.toLowerCase().includes(q);
      return inLabel || inKeys || inTip;
    });
    return inName || inTag || inSections;
  });

  if (!filtered.length) {
    container.innerHTML = `<div class="no-results">◌<span>no results for "${searchVal}"</span></div>`;
    return;
  }

  container.innerHTML = filtered.map((p, i) => {
    const id = `sec-${i}`;
    const isOpen = openSections.has(p.name) || q.length > 0;
    return `<div class="section">
      <div class="section-header" onclick="toggleSection('${p.name}','${id}')">
        <span class="section-icon">${p.icon}</span>
        <div style="flex:1;min-width:0">
          <div class="section-name">${p.name}</div>
          <div class="section-tagline">${p.tagline}</div>
        </div>
        <span class="section-badge ${badgeClass(p.cat)}">${catLabel(p.cat)}</span>
        <span class="chevron ${isOpen?'open':''}" id="chev-${p.name.replace(/\s/g,'_')}">▶</span>
      </div>
      <div class="section-body ${isOpen?'open':''}" id="${id}">
        ${renderSections(p.sections)}
      </div>
    </div>`;
  }).join('');
}

function toggleSection(name, id) {
  const body = document.getElementById(id);
  const chev = document.getElementById('chev-' + name.replace(/\s/g,'_'));
  const isOpen = body.classList.contains('open');
  if (isOpen) { body.classList.remove('open'); chev.classList.remove('open'); openSections.delete(name); }
  else { body.classList.add('open'); chev.classList.add('open'); openSections.add(name); }
}

document.getElementById('search').addEventListener('input', e => {
  searchVal = e.target.value;
  render();
});

document.getElementById('tabs').addEventListener('click', e => {
  const tab = e.target.closest('.tab');
  if (!tab) return;
  activeFilter = tab.dataset.cat;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  tab.classList.add('active');
  render();
});

render();
